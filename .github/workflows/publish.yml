# Trusted Publishing via OIDC (no long-lived PyPI tokens in GitHub secrets).
# Setup: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# uv guide: https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
name: Publish

on:
  # Manual TestPyPI (default) or PyPI publish without a git tag.
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  # Production releases: push a version tag (e.g. v0.1.0) → PyPI.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Build
        # --no-sources matches what consumers get (no tool.uv.sources).
        run: uv build --no-sources

      # Inline -c (not a file under tests/) so tests/backend/ cannot shadow the
      # installed backend package. Run outside the repo for the same reason.
      - name: Smoke test (wheel)
        working-directory: ${{ runner.temp }}
        run: >
          uv run --isolated --no-project
          --with "${{ github.workspace }}/dist/"*.whl
          -- python -c "import alumet_insight, cli, dashboard; print('smoke_test ok')"

      - name: Smoke test (source distribution)
        working-directory: ${{ runner.temp }}
        run: >
          uv run --isolated --no-project
          --with "${{ github.workspace }}/dist/"*.tar.gz
          -- python -c "import alumet_insight, cli, dashboard; print('smoke_test ok')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/alumet-insight/
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Checkout is required so uv can read [[tool.uv.index]] testpypi.
      # TestPyPI often rejects attestations; skip them here.
      - name: Publish to TestPyPI
        run: uv publish --index testpypi --no-attestations

  publish-pypi:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/alumet-insight/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.6

      - name: Publish to PyPI
        run: uv publish
